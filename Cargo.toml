[workspace]
members = [".", "crudly-macros"]

[package]
name = "crudly"
version = "0.1.0"
edition = "2024"

[features]
default = ["postgres", "sqlite", "mysql"]
postgres = ["sqlx/postgres"]
sqlite = ["sqlx/sqlite"]
mysql = ["sqlx/mysql"]

[dependencies]
sqlx = { version = "0.8.6", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "derive", "sqlite"] }
