[workspace]
members = [".", "crudly-macros"]

[package]
name = "crudly"
version = "0.1.0"
edition = "2024"

[features]
default = []
postgres = ["sqlx/postgres"]
sqlite = ["sqlx/sqlite"]
mysql = ["sqlx/mysql"]
json = ["sqlx/json", "crudly-macros/json"]

[dependencies]
sqlx = { version = "0.8.6", default-features = false }
crudly-macros = { path = "crudly-macros", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "derive", "sqlite", "json"] }
crudly = { path = ".", features = ["postgres", "sqlite", "mysql", "json"] }
serde = "1"
serde_json = "1"
log = "0.4" # For mocking a DB
url = "2" # For mocking a DB