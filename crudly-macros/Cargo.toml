[package]
name = "crudly-macros"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Proc-macros for the crudly crate (`IntoRow` and `Crudly` derive)."
repository = "https://github.com/TimoLehnertz/crudly"
readme = "../README.md"
rust-version = "1.86.0"
authors = ["Timo Lehnertz <timolehnertz1@gmail.com>"]
keywords = ["sqlx", "crud", "derive", "intorow"]
categories = ["database"]

[lib]
proc-macro = true

[features]
default = []
json = []

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits"] } # Todo: strip features
quote = "1.0"
proc-macro2 = "1.0"
heck = "0.5"
