[package]
name = "crudly-macros"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Proc-macros for the crudly crate (`IntoRow` and `Crudly` derive)."
repository = "https://github.com/TimoLehnertz/crudly"
readme = "../README.md"
rust-version = "1.85.0"
authors = ["Timo Lehnertz <timolehnertz1@gmail.com>"]
keywords = ["sqlx", "crud", "derive", "intorow"]
categories = ["database"]

[lib]
proc-macro = true

[features]
default = []
json = []

[dependencies]
syn = { version = "2.117", default-features = false, features = ["derive", "parsing", "printing", "proc-macro"] }
quote = "1.0"
proc-macro2 = "1.0"
heck = "0.5"
